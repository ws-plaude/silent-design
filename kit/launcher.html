  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Settings.jsx?v=76"></script>

  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Musig.jsx?v=66"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs">
    function MenuDemo() {
      const [wallets, setWallets] = React.useState(KNOWN_WALLETS);
      return (
        <MenuTab wallets={wallets} openWallets={[]}
          onOpen={() => {}}
          onCreate={(n) => setWallets(w => w.includes(n) ? w : [...w, n])}
          onDelete={(n) => setWallets(w => w.filter(x => x !== n))} />
      );
    }
    const noop = () => {};
    const F = (el, h = 480) => ({ frame: true, height: h, el: <div style={{ position: 'relative', height: '100%' }}>{el}</div> });
    const RA = (title, kind, initial, h = 440) => ({ title, tag: 'RestoreAccountModal', span: 'span2', ...F(<RestoreAccountModal kind={kind} initial={initial} onClose={noop} />, h) });
    const FILE = (n) => `${n}-20261107.bip138`;
    Gallery.render({
      kicker: 'Launcher · components', title: 'Launcher (Menu tab)',
      lede: 'The wallet launcher: wordmark, a prominent “+ Create Account” action opening the Account Type picker, and the list of existing wallets (open / delete). Create and Delete open their modals — try them in the frame.',
      groups: [
        { name: 'Screen', items: [
          { title: 'Launcher — full screen (Create / Delete modals live)', tag: 'MenuTab', span: 'full', frame: true, height: 560, el: <MenuDemo /> },
          { title: 'Account Type: each creator, then its restore from a backup', tag: 'AccountType', span: 'span2', ...F(<AccountType types={ACCOUNT_TYPES} onCancel={noop} onPick={noop} />, 400) },
        ]},
        { name: 'Restore Account (from the Account Type picker)', items: [
          RA('File: no file chosen', 'sp', {}, 380),
          RA('File: ready to read', 'sp', { file: FILE('savings') }, 380),
          RA('File: not a backup Silent reads', 'sp', { file: 'notes.txt', error: 'This file is not a backup Silent reads: expected a BIP138 encrypted backup of a BIP139 wallet backup or of a descriptor, a BIP139 wallet backup or a descriptor.' }, 460),
          RA('File: the file is not read', 'sp', { error: 'The file is not read: Permission denied' }, 420),
          RA('Busy: reading the backup', 'sp', { busy: 'reading' }, 380),
          RA('Decrypt: a Multikey backup, devices trying, locked and failed', 'musig', { view: 'decrypt', file: FILE('multikey') }, 560),
          RA('Decrypt: an SP backup, no device listed, its keys offered', 'sp', { view: 'decrypt', file: FILE('savings') }, 900),
          RA('Decrypt: an SP backup, a key asked, a key failed, a key with its error', 'sp', { view: 'decrypt', file: FILE('savings'), devices: [], keys: { '73c5da0a': { status: 'asking' }, 'f23a9e01': { status: 'failed' }, '9a41e6b3': { status: 'failed', error: 'Wrong password. Try again.' } } }, 860),
          RA('Decrypt: a locked device with no state detail', 'sp', { view: 'decrypt', file: FILE('savings'), devices: [{ id: 'hid-0006', brand: 'Blockstream', model: 'Jade', fp: null, state: 'locked' }] }, 760),
          RA('Decrypt: no device connected', 'sp', { view: 'decrypt', file: FILE('savings'), devices: [] }, 860),
          RA('Decrypt: other options, invalid xpub', 'musig', { view: 'decrypt', file: FILE('multikey'), devices: [], options: true, xpub: 'tpubnotanxpub', xpubNote: 'Invalid xpub' }, 1100),
          RA('Decrypt: other options, an SP backup: no xpub rows', 'sp', { view: 'decrypt', file: FILE('savings'), devices: [], options: true }, 1100),
          RA('Decrypt: other options, an xpub that cannot decrypt it', 'musig', { view: 'decrypt', file: FILE('multikey'), devices: [], options: true, xpub: DEMO_XPUB_T, xpubNote: 'Xpub is valid but cannot decrypt this file' }, 900),
          RA('Decrypt: other options, the risk acknowledged, a mnemonic that cannot decrypt it', 'sp', { view: 'decrypt', file: FILE('savings'), devices: [], options: true, ack: true, mnemonic: 'abandon ability able about above absent absorb abstract absurd abuse access account', mnemonicNote: 'Mnemonic is valid but cannot decrypt the file' }, 1240),
          RA('Decrypt: other options, an invalid mnemonic', 'sp', { view: 'decrypt', file: FILE('savings'), devices: [], options: true, ack: true, mnemonic: 'abandon ability able about above absent absorb abstract absurd abuse access hello', mnemonicNote: 'Invalid mnemonic' }, 1240),
          RA('Review: a silent payment backup, decrypted with a device', 'sp', { view: 'review', opener: 'Decrypted with Ledger Nano S Plus #73c5da0a' }, 700),
          RA('Review: a Multikey backup, decrypted with an xpub, with its warning', 'musig', { view: 'review', opener: 'Decrypted with the xpub given' }, 720),
          RA('Review: a plain descriptor, its network unsaid, no name yet', 'descriptor', { view: 'review' }, 760),
          RA('Review: decrypted with the mnemonic, the restore failed', 'musig', { view: 'review', opener: 'Decrypted with the mnemonic given', restoreError: "An account named 'multikey' exists: delete it first" }, 780),
          RA('Busy: restoring the account', 'musig', { busy: 'restoring' }, 380),
          RA('Restored', 'sp', { view: 'restored' }, 300),
        ]},
      ],
    });
  </script>
