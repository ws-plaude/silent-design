<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<body>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Icons.jsx?v=3"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Primitives.jsx?v=36"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Layout.jsx?v=3"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Widgets.jsx?v=67"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Variants.jsx?v=46"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Modal.jsx?v=8"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Address.jsx?v=9"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Data.jsx?v=20"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Sidebar.jsx?v=8"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Keys.jsx?v=49"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Signing.jsx?v=25"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/AddKey.jsx?v=28"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/ScreensBasic.jsx?v=52"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/TxFlow.jsx?v=6"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Send.jsx?v=52"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Settings.jsx?v=67"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/MenuTab.jsx?v=66"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Musig.jsx?v=63"></script>

  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs">
    const W = WALLETS[KNOWN_WALLETS[0]] || Object.values(WALLETS)[0];

    const inItems = [
      { w: 0.02, title: 'Input #1', addr: '3a9f2c…1d4e:0' },
      { w: 0.015, title: 'Input #2', addr: '7b1e84…9c0f:1' },
    ];
    const outItems = [
      { w: 0.025, kind: 'recipient', title: 'Rent payment', label: 'Rent payment', addr: 'bc1q7eu…h3esg' },
      { w: 0.00984, kind: 'change', title: 'Change', addr: '(returned to your wallet)' },
      { w: 0.00016, kind: 'fee', title: 'Network fee', addr: '(paid to miners)' },
    ];

    function PaymentDemo() {
      const [out, setOut] = React.useState({ address: 'bc1q7eu259lf71x9anq4ezev8xdyuhk3esg',
        amount: '0.025', label: 'Rent payment', max: false });
      return <RecipientCard out={out} idx={0} deletable canMax onChange={setOut} onDelete={() => {}} />;
    }

    function SummaryDemo() {
      const { price } = React.useContext(PriceFeedContext);
      return (
        <TransactionSummary
          rows={[
            { label: 'Sending', value: '0.02500000 BTC', sub: formatFiat(0.025, price) },
            { label: 'Network fee', value: '0.00016000 BTC', sub: formatFiat(0.00016, price) },
            { label: 'Change', value: '0.00984000 BTC', sub: formatFiat(0.00984, price) },
          ]}
          total={{ label: 'Total', value: '0.02516000 BTC', sub: formatFiat(0.02516, price) }} />
      );
    }

    function CoinSelectDemo() {
      const [sel, setSel] = React.useState({ 0: true, 1: true });
      return (
        <CoinTable coins={W.coins} maxHeight={0}
          isChecked={(c, i) => !!sel[i]}
          onToggle={(i, v) => setSel({ ...sel, [i]: v })} />
      );
    }

    Gallery.render({
      kicker: 'Send · components',
      title: 'Send panel',
      lede: 'The Send screen and its building blocks — the transaction-shape diagram, payment cards, the live transaction summary, and coin selection. All interactive with mock data.',
      groups: [
        { name: 'Screen', items: [
          { title: 'Send — full screen', tag: 'SendScreen', span: 'full', frame: true, height: 660, el: <SendScreen wallet={W} /> },
          { title: 'Send: EUR available from the explicitly selected feed, including fee, change, total and hover cards', tag: 'SendScreen', span: 'full', frame: true, height: 1300, el: <PriceFeedProvider sources={PRICE_FEED_SOURCES} initialSelection={{ source: PRICE_FEED_SOURCES[0].id, currency: 'EUR' }}><SendScreen wallet={W} initial={{ payments: [{ address: MUSIG_ADDRESS, amount: '0.005', label: 'Invoice', max: false }] }} /></PriceFeedProvider> },
          { title: 'Send: selected quote unavailable, no fiat entry or equivalents', tag: 'SendScreen', span: 'full', frame: true, height: 1300, el: <PriceFeedProvider sources={[{ ...PRICE_FEED_SOURCES[0], rates: {} }]} initialSelection={{ source: PRICE_FEED_SOURCES[0].id, currency: 'EUR' }}><SendScreen wallet={W} initial={{ payments: [{ address: MUSIG_ADDRESS, amount: '0.005', label: 'Invoice', max: false }] }} /></PriceFeedProvider> },
          { title: 'Send: Default recommendation at 0.5 sat/vB; typing a rate or toggling absolute fee switches to Manual', tag: 'SendScreen', span: 'full', frame: true, height: 1300, el: <FeeFeedProvider sources={FEE_FEED_SOURCES} initialPreferences={{ mode: 'Default', source: FEE_FEED_SOURCES[0].id }}><SendScreen wallet={W} initial={{ payments: [{ address: MUSIG_ADDRESS, amount: '0.005', label: 'Invoice', max: false }] }} /></FeeFeedProvider> },
          { title: 'Send: Smart starts at Medium (0.75 sat/vB); select Low (0.25) or Fast (2) locally in Send, never in global preferences', tag: 'SendScreen', span: 'full', frame: true, height: 1300, el: <FeeFeedProvider sources={FEE_FEED_SOURCES} initialPreferences={{ mode: 'Smart', source: FEE_FEED_SOURCES[1].id }}><SendScreen wallet={W} initial={{ payments: [{ address: MUSIG_ADDRESS, amount: '0.005', label: 'Invoice', max: false }] }} /></FeeFeedProvider> },
        ]},
        { name: 'Transaction shape', items: [
          { title: 'Populated (2 in → recipient · change · fee)', tag: 'TxFlow', span: 'span2', el: <Card tone="inset" style={{ padding: '12px 10px 8px' }}><TxFlow inputs={inItems} outputs={outItems} /></Card> },
          { title: 'Empty state', tag: 'TxFlow', el: <Card tone="inset" style={{ padding: '12px 10px 8px' }}><TxFlow inputs={[]} outputs={[]} /></Card> },
        ]},
        { name: 'Building blocks', items: [
          { title: 'Payment card', tag: 'RecipientCard', span: 'span2', el: <PaymentDemo /> },
          { title: 'Transaction summary', tag: 'TransactionSummary', el: <SummaryDemo /> },
          { title: 'Coin selection (manual)', tag: 'CoinTable', span: 'span2', el: <CoinSelectDemo /> },
        ]},
        { name: 'Broadcast', items: [
          { title: 'Sent: the txid, chunked, with a copy button', tag: 'SentModal', span: 'span2', frame: true, height: 420, el: <div style={{ position: 'relative', height: '100%' }}><SentModal onClose={() => {}} /></div> },
        ]},
      ],
    });
  </script>
</body>
</html>
