<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Silent — Global Settings · components</title>
<link rel="stylesheet" href="../styles.css?v=57" />
<link rel="stylesheet" href="gallery.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="harness.js"></script>
</head>
<body>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Icons.jsx?v=3"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Primitives.jsx?v=36"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Layout.jsx?v=3"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Widgets.jsx?v=67"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Variants.jsx?v=46"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Modal.jsx?v=8"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Address.jsx?v=9"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Data.jsx?v=20"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Sidebar.jsx?v=8"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Keys.jsx?v=49"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Signing.jsx?v=25"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/AddKey.jsx?v=28"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/ScreensBasic.jsx?v=52"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/TxFlow.jsx?v=6"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Send.jsx?v=52"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Settings.jsx?v=67"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/MenuTab.jsx?v=66"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Musig.jsx?v=63"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/GlobalSettings.jsx?v=30"></script>

  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs">
    const noop = () => {};
    const F = (el, h = 640) => ({ frame: true, height: h, el: <div style={{ position: 'relative', height: '100%' }}>{el}</div> });
    const GS = (props, h) => ({ span: 'full', ...F(<GlobalSettingsTab onTheme={noop} {...props} />, h) });
    const P = (id) => PLUGINS.find(p => p.id === id);
    const enabledOnly = [P('atomic-swaps')];
    const refusing = PLUGINS.map(p => p.id === 'atomic-swaps' ? { ...p, enabled: false, removing: true, disableFailed: true, error: 'Shutdown failed; plugin remains disabled and loaded. Retry disable to keep saved data, or confirm Remove to erase it.' } : p);

    function PriceSettingsDemo({ initialSelection, initialSources = PRICE_FEED_SOURCES, locked = false }) {
      const [sources, setSources] = React.useState(initialSources);
      const setQuote = rate => setSources(rows => rows.map(s => s.id === PRICE_FEED_SOURCES[0].id ? { ...s, rates: { ...s.rates, EUR: rate } } : s));
      return <PriceFeedProvider sources={sources} initialSelection={initialSelection}>
        <Stack gap="s" style={{ height: '100%' }}>
          <Row gap="s" wrap>
            <Text variant="caption">Kit controls, not app UI:</Text>
            <Button onClick={() => setQuote(62000)}>Push EUR quote</Button>
            <Button onClick={() => setQuote(null)}>Withdraw EUR quote</Button>
            <Button onClick={() => setSources(rows => rows.filter(s => s.id !== PRICE_FEED_SOURCES[0].id))}>Unload source A</Button>
            <Button onClick={() => setSources(PRICE_FEED_SOURCES)}>Reload sources</Button>
          </Row>
          <Stack style={{ height: 480, flex: 'none' }}><GlobalSettingsTab plugins={[]} sections={[]} /></Stack>
          <Divider space="0" />
          <SendScreen wallet={locked ? WALLETS.multikey : WALLETS.savings}
            initial={locked ? SAVED_PSBTS[0] : { payments: [{ address: MUSIG_ADDRESS, amount: '0.00500000', label: 'Invoice', max: false }] }} />
        </Stack>
      </PriceFeedProvider>;
    }
    const Prices = (props) => ({ tag: 'PriceFeedSection / SendScreen', span: 'full', ...F(<PriceSettingsDemo {...props} />, 1900) });

    function FeeSettingsDemo({ initialPreferences = FEE_PREFERENCES, initialSources = FEE_FEED_SOURCES, locked = false, wallet = WALLETS.savings }) {
      const [sources, setSources] = React.useState(initialSources);
      const [version, setVersion] = React.useState(0);
      const push = () => setSources(rows => rows.map(s => ({ ...s,
        defaultRate: s.id === FEE_FEED_SOURCES[0].id ? 0.625 : 4,
        smartRates: { Low: 0.125, Medium: 0.5, Fast: 1.5 } })));
      const withdraw = () => setSources(rows => rows.map(s => ({ ...s, defaultRate: null, smartRates: {} })));
      return <FeeFeedProvider sources={sources} initialPreferences={initialPreferences}>
        <Stack gap="s" style={{ height: '100%' }}>
          <Row gap="s" wrap>
            <Text variant="caption">Kit controls, not app UI:</Text>
            <Button onClick={push}>Push recommendations</Button>
            <Button onClick={withdraw}>Withdraw recommendations</Button>
            <Button onClick={() => setSources([])}>Unload fee feeds</Button>
            <Button onClick={() => setSources(initialSources.length ? initialSources : FEE_FEED_SOURCES)}>Reload fee feeds</Button>
            <Button onClick={() => setVersion(n => n + 1)}>New transaction</Button>
          </Row>
          <Stack style={{ height: 640, flex: 'none' }}><GlobalSettingsTab plugins={[]} sections={[]} /></Stack>
          <Divider space="0" />
          <SendScreen key={version} wallet={locked ? WALLETS.multikey : wallet}
            initial={locked ? SAVED_PSBTS[0] : { payments: [{ address: MUSIG_ADDRESS, amount: '0.00500000', label: 'Invoice', max: false }] }} />
        </Stack>
      </FeeFeedProvider>;
    }
    const Fees = props => ({ tag: 'FeeSettingsSection / SendScreen', span: 'full', ...F(<FeeSettingsDemo {...props} />, 2100) });
    const feePreference = (mode, source = FEE_FEED_SOURCES[mode === 'Default' ? 0 : 1].id) => ({ mode, source });

    Gallery.render({
      kicker: 'Settings · components',
      title: 'Global Settings',
      lede: 'Issues #4, #46 and #48. The gear tab right of Keys opens a page titled once, as the Keys page. Opening a section, a plugin access or confirming a plugin disable replaces the page content, with a way back; leaving the tab goes back to the sections. Every state is its own item.',
      groups: [
        { name: '1 · Entry point', items: [
          { title: 'The settings gear tab, right of Keys among the module tabs: account tabs scroll, never under them (issues #46, #48)', tag: 'Tab', span: 'full', el: (
            <div className="s-tabstrip" style={{ padding: 'var(--pad-xs) var(--pad-xs) 0', background: 'var(--bg-secondary)', borderBottom: '1px solid var(--border)', maxWidth: 620 }}>
              <div className="s-tabstrip__tabs">
                {['savings', 'cold-storage', 'testing', 'business', 'donations', 'swaps'].map(n => <Tab key={n} label={n} closable />)}
                <Tab label="+" handle closable={false} />
              </div>
               <div className="s-tabstrip__modules"><Tab label="Keys" closable={false} /><Tab label="Settings" icon="settings" handle active closable={false} /></div>
            </div>) },
        ]},
        { name: '2.1 · General', items: [
          { title: 'Default — Light, three plugins, two extension sections', tag: 'GlobalSettingsTab', ...GS({}, 900) },
          { title: 'Module theme selected', tag: 'GeneralSection', ...GS({ initial: { theme: 'Midnight' } }, 900) },
          { title: 'Language changed — saved, restart note', tag: 'GeneralSection', ...GS({ initial: { language: 'Français', langSaved: true } }, 900) },
        ]},
        { name: 'Price feed (issue #52)', items: [
          { title: 'Sources available, None selected: choose source, then currency; Send has no fiat until both are chosen', ...Prices({}) },
          { title: 'EUR selected: edits convert, pushed quotes only refresh fiat; unload retains the selection, no fallback to source B', ...Prices({ initialSelection: { source: PRICE_FEED_SOURCES[0].id, currency: 'EUR' } }) },
          { title: 'Selected source unavailable: retained source and currency are marked unavailable, Send is BTC-only', ...Prices({ initialSources: [PRICE_FEED_SOURCES[1]], initialSelection: { source: PRICE_FEED_SOURCES[0].id, currency: 'EUR' } }) },
          { title: 'Selected currency no longer offered: retain EUR as unavailable, do not choose USD', ...Prices({ initialSources: [{ ...PRICE_FEED_SOURCES[0], currencies: ['USD'] }], initialSelection: { source: PRICE_FEED_SOURCES[0].id, currency: 'EUR' } }) },
          { title: 'No price providers: section hidden even with a retained selection', ...Prices({ initialSources: [], initialSelection: { source: PRICE_FEED_SOURCES[0].id, currency: 'EUR' } }) },
          { title: 'Saved PSBT: price changes refresh fiat, never its locked BTC payments, inputs, fee or spend path', ...Prices({ locked: true, initialSelection: { source: PRICE_FEED_SOURCES[0].id, currency: 'EUR' } }) },
        ]},
        { name: 'Transaction fees (issues #53, #75)', items: [
          { title: 'Fee settings: providers available, None selected; Manual remains 1 sat/vB until explicitly configured', ...Fees({}) },
          { title: 'Default fees: selected source, fractional pushed recommendations and manual override', ...Fees({ initialPreferences: feePreference('Default') }) },
          { title: 'Smart fees: initial Medium, per-send Low/Medium/Fast, sticky Manual fallback after withdrawal', ...Fees({ initialPreferences: feePreference('Smart') }) },
          { title: 'Default-only provider: one Provider selector; global modes Manual/Default, Send still offers Smart', ...Fees({ initialSources: [FEE_FEED_SOURCES[0]], initialPreferences: feePreference('Default') }) },
          { title: 'Smart-only provider: one Provider selector; global modes Manual/Smart, Send still offers Default', ...Fees({ initialSources: [FEE_FEED_SOURCES[1]], initialPreferences: feePreference('Smart') }) },
          { title: 'Combined provider: shared source, Default 3 differs from Smart Medium 2; change Send mode locally', ...Fees({ initialSources: [FEE_FEED_SOURCES[2]], initialPreferences: feePreference('Default', FEE_FEED_SOURCES[2].id) }) },
          { title: 'Default-only selection with Smart available elsewhere: global Smart remains selectable; no substitute quote', ...Fees({ initialPreferences: feePreference('Smart', FEE_FEED_SOURCES[0].id) }) },
          { title: 'Unavailable provider: retain its id and global Default mode, no automatic selection', ...Fees({ initialSources: [FEE_FEED_SOURCES[1]], initialPreferences: feePreference('Default') }) },
          { title: 'Missing Smart Medium: Manual at 1 sat/vB despite Low/Fast quotes; push recovery, then explicitly select Smart', ...Fees({ initialSources: [{ ...FEE_FEED_SOURCES[1], smartRates: { Low: 0.25, Fast: 2 } }], initialPreferences: feePreference('Smart') }) },
          { title: 'No fee providers: global Smart preference retained, Send falls back to Manual; recovery waits for a new transaction', ...Fees({ initialSources: [], initialPreferences: feePreference('Smart') }) },
          { title: 'Restored PSBT: actual fee stays 280 sats, no editable fee controls or recommendation changes', ...Fees({ locked: true, initialPreferences: feePreference('Smart') }) },
          { title: 'Prepared Multikey: Sign locks the fee; pushed recommendations cannot alter it while signing', ...Fees({ wallet: WALLETS.multikey, initialPreferences: feePreference('Smart') }) },
        ]},
        { name: '2.2 · Plugin Manager (issue #69): preview fixtures, no ZIP validation here. Native admission is not an OS sandbox.', items: [
          { title: 'No plugin yet: drop a ZIP bundle with any filename or extension', tag: 'PluginSection', ...GS({ plugins: [], sections: [] }, 560) },
          { title: 'Dragging a ZIP bundle over the window', tag: 'PluginDrop', ...GS({ plugins: [], sections: [], initial: { dragging: true } }, 560) },
          { title: 'ZIP bundle named payjoin.bundle: admitted, sealed into the state, listed off', tag: 'PluginSection', ...GS({ plugins: [{ id: 'payjoin', name: 'Payjoin', version: '1.2.3', desc: 'Payjoin sending and receiving.', enabled: false }], sections: [], initial: { added: { name: 'Payjoin' } } }, 660) },
          { title: 'Dropped again while on: an update', tag: 'PluginSection', ...GS({ sections: [], initial: { added: { name: 'Atomic Swaps', updated: true } } }, 760) },
          { title: 'Loose library rejected: imports must be ZIP bundles', tag: 'PluginSection', ...GS({ plugins: [], sections: [], initial: { notice: { tone: 'error', title: 'Could not add the plugin', body: '/home/user/Downloads/payjoin.so: not a ZIP archive' } } }, 640) },
          { title: 'ZIP bundle rejected: missing manifest', tag: 'PluginSection', ...GS({ plugins: [], sections: [], initial: { notice: { tone: 'error', title: 'Could not add the plugin', body: '/home/user/Downloads/payjoin: no manifest.json at the bundle root' } } }, 640) },
          { title: 'Disable — confirm (an account closes)', tag: 'DisablePluginConfirm', ...GS({ initial: { view: { disable: 'atomic-swaps' } } }, 460) },
          { title: 'Disable — confirm (nothing uses it)', tag: 'DisablePluginConfirm', ...GS({ plugins: PLUGINS.map(p => p.id === 'payjoin' ? { ...p, enabled: true } : p), initial: { view: { disable: 'payjoin' } } }, 380) },
          { title: 'Disable — unloading', tag: 'PluginRow', ...GS({ sections: [], initial: { busyId: 'atomic-swaps' } }, 640) },
          { title: 'Disable refused: retry disable preserves data; Remove remains separately destructive', tag: 'PluginSection', ...GS({ plugins: refusing, sections: [], initial: { notice: { tone: 'error', title: 'Plugin shutdown or removal failed', body: 'Shutdown failed; plugin remains disabled and loaded. Retry disable to keep saved data, or confirm Remove to erase it.' } } }, 700) },
        ]},
        { name: '2.2.1 · Destructive removal (#71): preview states only, no native shutdown or data erasure here.', items: [
          { title: 'Remove enabled plugin: named destructive confirmation, no keep-data option', tag: 'RemovePluginConfirm', ...GS({ initial: { view: { remove: 'atomic-swaps' } } }, 420) },
          { title: 'Remove disabled plugin: same destructive confirmation', tag: 'RemovePluginConfirm', ...GS({ initial: { view: { remove: 'payjoin' } } }, 420) },
          { title: 'Remove incompatible or failed plugin: metadata only, no constructor required', tag: 'RemovePluginConfirm', ...GS({ initial: { view: { remove: 'nostr-backup' } } }, 420) },
          { title: 'Removal pending: sources withdrawn, native work still closing', tag: 'PluginSection', ...GS({ plugins: PLUGINS.map(p => p.id === 'atomic-swaps' ? { ...p, enabled: false, removing: true } : p), sections: [], initial: { busyId: 'atomic-swaps', result: 'Removing atomic-swaps. Waiting for shutdown and private-data cleanup.' } }, 760) },
          { title: 'Partial cleanup failed: disabled with an explicit phase and retry', tag: 'PluginSection', ...GS({ plugins: PLUGINS.map(p => p.id === 'atomic-swaps' ? { ...p, enabled: false, removing: true, error: 'Private tree cleared; legacy-source deletion failed: io. Plugin and bundle retained; retry Remove after resolving the error.' } : p), sections: [], initial: { notice: { tone: 'error', title: 'Plugin shutdown or removal failed', body: 'Private tree cleared; legacy-source deletion failed: io. Plugin and bundle retained; retry Remove after resolving the error.' } } }, 760) },
          { title: 'Removal failure then retry: interactive preview fixture', tag: 'PluginSection', ...GS({ plugins: PLUGINS.map(p => p.id === 'atomic-swaps' ? { ...p, removeError: 'Unload failed; data and bundle retained. Retry removal.' } : p) }, 900) },
          { title: 'Interrupted removal: disabled until cleanup is retried', tag: 'PluginSection', ...GS({ plugins: PLUGINS.map(p => p.id === 'atomic-swaps' ? { ...p, enabled: false, removing: true, error: 'Removal was interrupted. Private data may already be cleared. Use Remove to finish cleanup.' } : p) }, 900) },
          { title: 'Pending-removal read error: plugin actions blocked, Try Again re-reads state', tag: 'PluginSection', ...GS({ plugins: refusing, initial: { readError: 'Application state is locked.', readErrorPersists: true } }, 1000) },
          { title: 'State readable on retry: known removal retained, Remove becomes available', tag: 'PluginSection', ...GS({ plugins: refusing, initial: { readError: 'Application state is locked.' } }, 1000) },
          { title: 'Successful removal: row and grants gone, unrelated plugins remain', tag: 'PluginSection', ...GS({ plugins: PLUGINS.filter(p => p.id !== 'atomic-swaps'), sections: [], initial: { result: 'atomic-swaps was removed with its saved state and accounts.' } }, 700) },
        ]},
        { name: '2.4 · Plugin access (issue #35)', items: [
          { title: 'Access: one row per library version answered, Accounts and Keys apply at once', tag: 'PluginAccessFlow', ...GS({ initial: { view: { access: 'atomic-swaps' } } }, 480) },
          { title: 'Access: every answer forgotten', tag: 'PluginAccessFlow', ...GS({ plugins: PLUGINS.map(p => p.id === 'atomic-swaps' ? { ...p, access: [] } : p), initial: { view: { access: 'atomic-swaps' } } }, 400) },
          { title: 'First use of the keys: asked, Allow or Deny kept for this library', tag: 'PluginAccessPrompt', span: 'full', ...F(<PluginAccessPrompt plugin={P('atomic-swaps')} account={false} keys onAnswer={noop} onClose={noop} />, 460) },
          { title: 'Asked for both through requestAccess()', tag: 'PluginAccessPrompt', span: 'full', ...F(<PluginAccessPrompt plugin={P('atomic-swaps')} account keys onAnswer={noop} onClose={noop} />, 540) },
          { title: 'A new version opens its saved data (issue #38)', tag: 'PluginAccessPrompt', span: 'full', ...F(<PluginAccessPrompt plugin={P('atomic-swaps')} account={false} state onAnswer={noop} onClose={noop} />, 460) },
        ]},
        { name: '2.3 · Extension Settings', items: [
          { title: 'No extension section — the section is hidden', tag: 'ExtensionSection', ...GS({ plugins: enabledOnly, sections: [] }, 560) },
          { title: 'All sections folded', tag: 'SectionHeader', ...GS({ initial: { folds: { general: false, fees: false, plugins: false, extensions: false } } }, 340) },
          { title: 'Section open — replaces the list, Back returns', tag: 'ExtensionFrame', ...GS({ initial: { view: { section: 'hw' } } }, 440) },
        ]},
        { name: 'Plugin rows', items: PLUGINS.map(p => ({ title: p.error ? 'Failed to load' : p.enabled ? 'Enabled' : 'Disabled', tag: 'PluginRow', span: 'span2', el: <PluginRow plugin={p} onToggle={noop} /> }))
          .concat([{ title: 'Unloading', tag: 'PluginRow', span: 'span2', el: <PluginRow plugin={P('atomic-swaps')} busy onToggle={noop} /> }]) },
      ],
    });
  </script>
</body>
</html>
