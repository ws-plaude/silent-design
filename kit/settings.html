<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Silent — Settings · components</title>
<link rel="stylesheet" href="../styles.css?v=57" />
<link rel="stylesheet" href="gallery.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="harness.js"></script>
</head>
<body>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Icons.jsx?v=3"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Primitives.jsx?v=36"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Layout.jsx?v=3"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Widgets.jsx?v=67"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Variants.jsx?v=46"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Modal.jsx?v=8"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Address.jsx?v=9"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Data.jsx?v=20"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/ScreensBasic.jsx?v=52"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/TxFlow.jsx?v=6"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Send.jsx?v=52"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs" src="../ui_kits/silent/Settings.jsx?v=67"></script>
  <script type="text/babel" data-presets="react" data-plugins="transform-modules-commonjs">
    const W = WALLETS[KNOWN_WALLETS[0]] || Object.values(WALLETS)[0];

    function EndpointRowDemo({ state, labelAbove = false }) {
      const [value, setValue] = React.useState(state === 'empty' ? '' : W.blindbit);
      const [test, setTest] = React.useState(state === 'failed' ? { error: 'Connection refused.' } : state === 'empty' ? null : state);
      return <EndpointRow label="BlindBit URL:" labelAbove={labelAbove} value={value}
        onChange={v => { setValue(v); setTest(null); }} test={test}
        onTest={() => { setTest('testing'); setTimeout(() => setTest('ok'), 900); }}
        rightControls={labelAbove ? <Btn id="connect_blindbit" /> : null} />;
    }
    function NetworkDemo() {
      const [net, setNet] = React.useState(W.network);
      return (
        <Field label="Network:" labelWidth={80}>
          <ComboBox value={net} options={NETWORKS} onChange={setNet} width={200} />
        </Field>
      );
    }

    Gallery.render({
      kicker: 'Settings · components', title: 'Settings panel',
      lede: 'Settings and creation share EndpointRow test states. Tests here are fixtures, not network requests.',
      groups: [
        { name: 'Screen', items: [
          { title: 'Settings — full screen', tag: 'SettingsScreen', span: 'full', frame: true, height: 560, el: <SettingsScreen wallet={W} /> },
          { title: 'Electrum Disconnected: the reconnect gave up after more than 3 drops in a minute', tag: 'ElectrumGaveUpModal', span: 'span2', frame: true, height: 380, el: <div style={{ position: 'relative', height: '100%' }}><ElectrumGaveUpModal onClose={() => {}} /></div> },
        ]},
        { name: 'Building blocks', items: [
          ...[['empty', 'Empty'], [null, 'Untested'], ['testing', 'Testing'], ['ok', 'Successful'], ['failed', 'Failed']].map(([state, title]) => ({
            title: `Endpoint row: ${title}`, tag: 'EndpointRow', span: 'span2', el: <EndpointRowDemo state={state} />,
          })),
          { title: 'Endpoint row: label above, independent connection control', tag: 'EndpointRow', span: 'span2', el: <EndpointRowDemo state="ok" labelAbove /> },
          { title: 'Network selector', tag: 'ComboBox', span: 'span2', el: <div style={{ padding: 4 }}><NetworkDemo /></div> },
        ]},
      ],
    });
  </script>
</body>
</html>
